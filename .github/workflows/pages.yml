name: Deploy catalog to Pages

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('catalog/catalog-source.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('catalog/v1/plugins.json','utf8'))"

      - name: Stage deploy artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R catalog/. _site/
          # Mirror the file so the URL pattern documented in
          # catalog/catalog-source.json (`/v1/plugins`, no extension) resolves.
          cp catalog/v1/plugins.json _site/v1/plugins
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>dsh-usage-stats · DSH Community Market source</title>
          <pre>DSH Community Market catalog source
          manifest:     <a href="catalog-source.json">catalog-source.json</a>
          provider page: <a href="v1/plugins">v1/plugins</a></pre>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
