name: Deploy catalog to Pages

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys; serialize.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('catalog/catalog-source.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('catalog/v1/plugins.json','utf8'))"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog

      - id: deployment
        uses: actions/deploy-pages@v4
