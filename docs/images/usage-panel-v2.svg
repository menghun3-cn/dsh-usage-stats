<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- dsh-usage-stats 0.2.17 panel layout (desaturated demo data) -->
