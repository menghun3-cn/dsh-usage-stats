      <circle cx="165" cy="324" r="2.5" fill="#1f6feb"/><text x="165" y="316" fill="#9aa0a6">3200.00</text><text x="165" y="358" fill="#8a8f98">01</text>
      <circle cx="202" cy="300" r="2.5" fill="#1f6feb"/><text x="202" y="292" fill="#9aa0a6">9600.00</text><text x="202" y="358" fill="#8a8f98">02</text>
      <circle cx="238" cy="348" r="2.5" fill="#1f6feb"/><text x="238" y="340" fill="#9aa0a6">500.00</text><text x="238" y="358" fill="#8a8f98">03</text>
      <circle cx="274" cy="330" r="2.5" fill="#1f6feb"/><text x="274" y="322" fill="#9aa0a6">2600.00</text><text x="274" y="358" fill="#8a8f98">04</text>
      <circle cx="311" cy="290" r="2.5" fill="#1f6feb"/><text x="311" y="282" fill="#9aa0a6">1.23万</text><text x="311" y="358" fill="#8a8f98">05</text>
      <circle cx="347" cy="320" r="2.5" fill="#1f6feb"/><text x="347" y="312" fill="#9aa0a6">4500.00</text><text x="347" y="358" fill="#8a8f98">06</text>
      <circle cx="384" cy="306" r="2.5" fill="#1f6feb"/><text x="384" y="298" fill="#9aa0a6">8000.00</text><text x="384" y="358" fill="#8a8f98">07</text>
