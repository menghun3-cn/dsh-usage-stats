    <rect x="8" y="492" width="128" height="36" rx="18" fill="#26292f" stroke="#33373f"/>
    <circle cx="28" cy="510" r="7" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
    <circle cx="28" cy="510" r="2" fill="#1f6feb"/>
    <text x="52" y="515" fill="#e6e6e6" font-size="13">用量 · 1.23亿</text>
  </g>

  <text x="8" y="560" fill="#555a63" font-size="9">脱敏演示数据 · 与 0.2.17 实际布局一致（徽标显示内容可在面板头部切换 今日/本月/累计）</text>
